name: Sync upstream

on:
  schedule:
    # 每天 UTC 19:00（北京时间 03:00）检查上游 tag。
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check upstream tags
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Compare upstream tags
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          # 去掉自维护后缀（例如 3.15.1-self.1 → 3.15.1），只和上游稳定 tag 比较。
          base="$(node -p "require('./package.json').version.split('-')[0]")"
          latest="$(git ls-remote --tags --refs https://github.com/zai-org/ZCode.git 'v*' \
            | sed 's#.*refs/tags/##' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n1)"
          if [ -z "$latest" ]; then
            echo "No stable upstream tag found" >&2
            exit 1
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "[upstream] base=v$base latest=$latest"
          if [ "$latest" = "v$base" ]; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update sync issue
        if: steps.upstream.outputs.new == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.upstream.outputs.latest }}
          BASE: ${{ steps.upstream.outputs.base }}
        run: |
          set -euo pipefail
          title="[upstream-sync] new upstream tag $LATEST"
          gh label create upstream-sync \
            --color 0E8A16 \
            --description "Upstream release tracking" 2>/dev/null || true
          existing="$(gh issue list --label upstream-sync --state open --json number,title \
            | jq -r --arg t "$title" '.[] | select(.title == $t) | .number' \
            | head -n1)"
          body="$(cat <<EOF
          上游出现新版本：$LATEST（当前基线 v$BASE）。

          检查命令：
            git fetch upstream --tags
            git log --oneline v$BASE..$LATEST
            git diff --stat v$BASE..$LATEST

          处理步骤：
          1. 创建 sync/upstream-$LATEST 分支。
          2. 合并 $LATEST，解决冲突。
          3. 重跑 CI 和 Windows 打包。
          4. PR 到 dev，验证后合并到 main。

          注意：不要使用 GitHub 的 “Sync fork” 覆盖自维护提交。
          EOF
          )"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label upstream-sync --body "$body"
          fi
          {
            echo "### Upstream sync"
            echo ""
            echo "- Current base: v$BASE"
            echo "- Latest upstream tag: $LATEST"
            echo "- Action: review the sync issue"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report up-to-date
        if: steps.upstream.outputs.new == 'false'
        shell: bash
        run: |
          {
            echo "### Upstream sync"
            echo ""
            echo "Current base matches the latest upstream stable tag."
          } >> "$GITHUB_STEP_SUMMARY"
