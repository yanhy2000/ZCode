name: Sync upstream

on:
  schedule:
    # 每天 UTC 19:00（北京时间 03:00）检查上游 tag。
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check upstream tags
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Compare upstream tags
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          # 版本格式为 <私有版本>+<官方基线>，只和 + 之后的上游稳定 tag 比较。
          base="$(node -p "require('./package.json').version.split('+')[1]")"
          if [ -z "$base" ]; then
            echo "package.json version is missing the +<upstream-base> part" >&2
            exit 1
          fi
          latest="$(git ls-remote --tags --refs https://github.com/zai-org/ZCode.git 'v*' \
            | sed 's#.*refs/tags/##' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n1)"
          if [ -z "$latest" ]; then
            echo "No stable upstream tag found" >&2
            exit 1
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "[upstream] base=v$base latest=$latest"
          # Bug 原因：上游会先合入源码同步、之后才补打 tag（3.16.1 就是以 `0a1fc56d` 合入、至今没有 `v3.16.1`），
          # 此时「最新稳定 tag」会低于本地基线。原判断是「tag 与基线不相等就要求同步」，于是基线领先上游 tag
          # 时每天都会误报 `Upstream tag v3.15.1 is newer than base v3.16.1` 并让 workflow 变红。
          # 这里改成按版本号大小比较：只有上游 tag 严格高于基线才要求同步，相等/领先一律视为已跟上。
          newest="$(printf '%s\n%s\n' "v$base" "$latest" | sort -V | tail -n1)"
          if [ "$latest" = "v$base" ]; then
            state="current"
          elif [ "$newest" = "v$base" ]; then
            state="ahead"
          else
            state="behind"
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "[upstream] state=$state"
          if [ "$state" = "behind" ]; then
            echo "new=true" >> "$GITHUB_OUTPUT"
          else
            echo "new=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Feishu (optional)
        if: steps.upstream.outputs.new == 'true'
        shell: bash
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          LATEST: ${{ steps.upstream.outputs.latest }}
          BASE: ${{ steps.upstream.outputs.base }}
        run: |
          if [ -z "${FEISHU_WEBHOOK:-}" ]; then
            echo "FEISHU_WEBHOOK not configured; skipping Feishu notification"
            exit 0
          fi
          curl -fsS -X POST -H "Content-Type: application/json" \
            -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"ZCode 上游出现新 tag $LATEST（当前基线 v$BASE），请同步。\"}}" \
            "$FEISHU_WEBHOOK" || echo "Feishu notification failed"

      - name: Report new upstream tag
        if: steps.upstream.outputs.new == 'true'
        shell: bash
        env:
          LATEST: ${{ steps.upstream.outputs.latest }}
          BASE: ${{ steps.upstream.outputs.base }}
        run: |
          {
            echo "### Upstream sync required"
            echo ""
            echo "- Current base: v$BASE"
            echo "- Latest upstream tag: $LATEST"
            echo ""
            echo "Commands:"
            echo '```bash'
            echo "git fetch upstream --tags"
            echo "git log --oneline v$BASE..$LATEST"
            echo "git diff --stat v$BASE..$LATEST"
            echo '```'
            echo ""
            echo "Do not use GitHub's Sync fork; it would overwrite self-host commits."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Upstream tag $LATEST is newer than base v$BASE. Sync manually."
          exit 1

      - name: Report up-to-date
        if: steps.upstream.outputs.new == 'false'
        shell: bash
        env:
          LATEST: ${{ steps.upstream.outputs.latest }}
          BASE: ${{ steps.upstream.outputs.base }}
          STATE: ${{ steps.upstream.outputs.state }}
        run: |
          {
            echo "### Upstream sync"
            echo ""
            if [ "$STATE" = "ahead" ]; then
              echo "- Current base: v$BASE"
              echo "- Latest upstream tag: $LATEST"
              echo ""
              echo "基线领先于最新上游稳定 tag：上游可能已合入源码同步但尚未补打 tag（3.16.1 即此情况），"
              echo "无需同步。等上游补 tag 后本工作流会自动恢复「相等」判定。"
            else
              echo "Current base matches the latest upstream stable tag."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
