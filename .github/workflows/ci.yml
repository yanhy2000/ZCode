name: CI

on:
  # 仓库已关闭 Pull Requests，只保留直接 push 和手动触发。
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24.14.0"
  HUSKY: "0"

jobs:
  checks:
    name: Typecheck / Lint / Architecture / Affected tests
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify version identity
        shell: pwsh
        run: |
          node -e "const root=require('./package.json').version; const cli=require('./apps/zcode-cli/package.json').version; if (root !== '3.15.1') throw new Error('root version=' + root); if (cli !== root) throw new Error('cli version=' + cli + ' != root ' + root); console.log('[version] root=' + root + ' cli=' + cli)"
          node -e "const { getBuildMetadata } = require('./packages/desktop/scripts/build-metadata.mjs'); const version = getBuildMetadata().appVersion; if (version !== '3.15.1') throw new Error('desktop build version=' + version); console.log('[version] desktop=' + version)"
          node --input-type=module -e "import { readRootPackageVersion } from './apps/zcode-cli/packages/cli/scripts/build.mjs'; const version = await readRootPackageVersion(); if (version !== '3.15.1') throw new Error('cli bundle version=' + version); console.log('[version] cli-bundle=' + version)"

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check (non-blocking)
        shell: pwsh
        run: |
          pnpm fmt:check
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::pnpm fmt:check reports pre-existing formatting drift; not blocking CI."
          }
          exit 0

      - name: Architecture check
        run: pnpm architecture:check

      - name: Affected unit tests
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "pull_request") {
            $env:ZCODE_AFFECTED_TEST_BASE = "origin/$env:GITHUB_BASE_REF"
          } else {
            $env:ZCODE_AFFECTED_TEST_BASE = "HEAD^"
          }
          pnpm test:unit:affected
