name: Build Windows

on:
  workflow_call:
  workflow_dispatch:
  # 只在手动触发或 release workflow 复用时打包；日常提交不自动构建。

concurrency:
  group: build-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24.14.0"
  HUSKY: "0"
  # 自维护构建固定使用生产后端与正式身份，安装包会替换同机官方 ZCode。
  ZCODE_ENV: production
  ZCODE_PREVIEW_IDENTITY: "0"
  ZCODE_SKIP_REMOTE_ASSETS: "1"

jobs:
  build:
    name: Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify version identity
        shell: pwsh
        run: |
          node -e "const root=require('./package.json').version; const cli=require('./apps/zcode-cli/package.json').version; if (!/^\d+\.\d+\.\d+\+\d+\.\d+\.\d+$/.test(root)) throw new Error('root version does not match private+official: ' + root); if (cli !== root) throw new Error('cli version=' + cli + ' != root ' + root); console.log('[version] root=' + root + ' cli=' + cli)"
          node -e "const { getBuildMetadata } = require('./packages/desktop/scripts/build-metadata.mjs'); const root=require('./package.json').version; const version = getBuildMetadata().appVersion; if (version !== root) throw new Error('desktop build version=' + version + ' != root ' + root); console.log('[version] desktop=' + version)"

      - name: Normalize Gen UI vendor line endings
        shell: pwsh
        run: |
          $vendor = "apps/zcode-cli/packages/visualize-plugin/skills/visualize/assets/vendor"
          Get-ChildItem -Path $vendor -File -Recurse | ForEach-Object {
            $text = [System.IO.File]::ReadAllText($_.FullName)
            if ($text.Contains("`r`n")) {
              [System.IO.File]::WriteAllText(
                $_.FullName,
                $text.Replace("`r`n", "`n"),
                [System.Text.UTF8Encoding]::new($false)
              )
            }
          }

      - name: Build Windows x64 installer
        run: pnpm --filter @zcode/desktop bundle -- --os win --arch x64

      - name: Verify production identity
        shell: pwsh
        run: |
          $appDir = "packages/desktop/dist/win-unpacked"
          $appExe = Join-Path $appDir "ZCode.exe"
          $previewExe = Join-Path $appDir "ZCode Preview.exe"
          if (-not (Test-Path $appExe)) {
            throw "Missing packaged application: $appExe"
          }
          if (Test-Path $previewExe) {
            throw "Preview identity leaked into production build: $previewExe"
          }
          node -e "const asar=require('@electron/asar'); const pkg=JSON.parse(asar.extractFile('packages/desktop/dist/win-unpacked/resources/app.asar','package.json').toString()); const root=require('./package.json').version; if (pkg.zcodeProductFlavor !== 'production') throw new Error('flavor=' + pkg.zcodeProductFlavor); if (pkg.version !== root) throw new Error('app version=' + pkg.version + ' != root ' + root); console.log('[identity] product=ZCode flavor=' + pkg.zcodeProductFlavor + ' version=' + pkg.version)"

      - name: Verify installer version and checksum
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $expectedName = "ZCode-$version-win-x64.exe"
          $installer = Get-ChildItem -Path packages/desktop/dist -Filter *.exe | Select-Object -First 1
          if ($null -eq $installer) {
            throw "No Windows installer was produced under packages/desktop/dist"
          }
          if ($installer.Name -ne $expectedName) {
            throw "Unexpected installer name: $($installer.Name); expected $expectedName"
          }
          Write-Host "[artifact] $($installer.FullName)"
          Get-ChildItem -Path packages/desktop/dist -Filter *.exe | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Path packages/desktop/dist/SHA256SUMS.txt -Encoding utf8
          Get-Content packages/desktop/dist/SHA256SUMS.txt

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: zcode-windows-x64
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.blockmap
            packages/desktop/dist/*.yml
            packages/desktop/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
